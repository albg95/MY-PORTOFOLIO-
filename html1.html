<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    .row{background-color: rgb(0, 0, 0) ;
        overflow: hidden;
        padding: 12px;
    }


    .button {float: left;
            background-color: aliceblue;
             font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
             font-style: italic;
             font-weight: bold;
            font-size: 20px;
            margin-left: 20px;
            padding: 14px 16px;
            cursor: pointer;
            border-radius: 35px;
            
         background-repeat: no-repeat;
    }

        .button:hover {
            background-color: brown;
            color: rgb(209, 195, 3);}

</style>

<body>


    <div class="row">

    <div class="button">HOME</div>
          <div class="button">ABOUT</div>
              <div class="button">CONTACT
              </div>

        </div>
    
</body>
</html>
